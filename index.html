        const fetchWeatherData = async (lat, lng) => {
            try {
                if (!WEATHER_API_KEY) return null;
                const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lng}&appid=${WEATHER_API_KEY}&units=metric&lang=ja`;

                if (!response.ok) throw new Error('Weather API Error');
                const data = await response.json();
                return {
                    condition: data.weather[0].description,
                    icon: data.weather[0].icon,
                    temp: Math.round(data.main.temp * 10) / 10,
                    wind: Math.round(data.wind.speed * 10) / 10

            } catch (error) {

        const getTodayDateString = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const toLocalISOString = (date) => {
            if (!date) return '';
            const d = new Date(date);
            const pad = (n) => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200;
                        const scaleSize = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(blob);
                            } else {
                                reject(new Error('Image compression failed'));
                            }
                        }, 'image/jpeg', 0.7);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        };

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function getPeriodLabel(period) {
            const now = new Date();
            if (period === 'week') {
                const monday = getMonday(now);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                return `今週 (${monday.getMonth() + 1}/${monday.getDate()}〜${sunday.getMonth() + 1}/${sunday.getDate()})`;
            } else if (period === 'month') {
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                return `今月 (${firstDay.getMonth() + 1}/${firstDay.getDate()}〜${lastDay.getMonth() + 1}/${lastDay.getDate()})`;
            } else if (period === 'year') {
                return `今年 (${now.getFullYear()}年)`;
            } else {
                return '全期間';
            }
        }

            for (let i = -14; i <= 2; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                dates.push(d);
            }

            const allEvents = [
                ...walks.map(w => ({ type: 'walk', date: new Date(w.startTime) })),
                ...healthRecords.map(h => ({ type: h.type, date: new Date(h.date) }))
            ];

            const getIcon = (type) => {
                const map = {
                    'walk': '🚶',
                    'excretion': '💩',
                    'food': '🥣',
                    'medicine': '💊',
                    'bath': '🛁',
                    'brushing': '✨',
                    'cleaning': '🧹',
                    'weight': '⚖️',
                    'grooming': '✂️',

                return map[type] || '✨';
            };

            useEffect(() => {
                if (todayRef.current) {
                    todayRef.current.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
                }

            return React.createElement('div', { className: 'w-full mb-2 bg-white/50 rounded-lg p-2' },
                React.createElement('div', {
                    ref: scrollRef,
                    className: 'flex gap-2 overflow-x-auto no-scrollbar pb-2 items-end h-32',
                },
                    dates.map((date, index) => {
                        const isToday = date.getTime() === today.getTime();
                        const dateKey = date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();

                        const dayEvents = allEvents.filter(e => {
                            const eDate = new Date(e.date);
                            return eDate.getFullYear() === date.getFullYear() &&
                                eDate.getMonth() === date.getMonth() &&
                                eDate.getDate() === date.getDate();
                        }).sort((a, b) => a.date - b.date);

                        const dayLabel = date.getDate();
                        const weekLabel = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];

                        return React.createElement('div', {
                            key: index,
                            ref: isToday ? todayRef : null,
                            className: 'flex flex-col-reverse items-center min-w-[32px] flex-shrink-0'
                        },
                            React.createElement('div', {
                                className: `text-xs mt-1 text-center border-t border-gray-400 w-full pt-1 ${isToday ? 'font-bold text-blue-700' : 'text-gray-600'}`

                                React.createElement('span', { className: 'text-[10px]' }, weekLabel)

                            )

                    })
                )

        function MapView({ positions, onClose }) {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const polylineRef = useRef(null);

            useEffect(() => {
                if (!positions || positions.length === 0 || !mapRef.current) return;

                if (!mapInstanceRef.current) {
                    mapInstanceRef.current = new google.maps.Map(mapRef.current, {
                        center: { lat: positions[0].lat, lng: positions[0].lng },
                        zoom: 15,
                        mapTypeId: google.maps.MapTypeId.ROADMAP,
                        disableDefaultUI: false,
                        zoomControl: true,
                        mapTypeControl: false,
                        streetViewControl: false,
                        fullscreenControl: false,
                        scaleControl: true,
                    });
                }

                const map = mapInstanceRef.current;
                const pathCoordinates = positions.map(p => ({ lat: p.lat, lng: p.lng }));

                if (polylineRef.current) {
                    polylineRef.current.setMap(null);
                }

                polylineRef.current = new google.maps.Polyline({
                    path: pathCoordinates,
                    geodesic: true,
                    strokeColor: "#2563EB",
                    strokeOpacity: 1.0,
                    strokeWeight: 5,
                });

                polylineRef.current.setMap(map);

                if (pathCoordinates.length > 0) {
                    const bounds = new google.maps.LatLngBounds();
                    pathCoordinates.forEach(coord => bounds.extend(coord));
                    map.fitBounds(bounds);
                }

                return () => {
                    if (polylineRef.current) {
                        polylineRef.current.setMap(null);
                    }
                };
            }, [positions]);

            return React.createElement('div', {
                className: 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4'
            },
                React.createElement('div', { className: 'bg-white rounded-lg w-full max-w-2xl' },

        function WalkEditForm({ walk, walkers, onSave, onCancel }) {
            const [formData, setFormData] = useState({
                walkers: walk.walkers || [],
                startTime: walk.startTime ? toLocalISOString(walk.startTime) : '',
                endTime: walk.endTime ? toLocalISOString(walk.endTime) : '',
                pee: walk.pee || false,
                poo: walk.poo || false,
                energy: walk.energy || 3,
                water: walk.water || false,
                memo: walk.memo || '',
                photos: walk.photos || []
            });
            const [uploading, setUploading] = useState(false);

            const toggleWalker = (walkerName) => {
                setFormData(prev => ({
                    ...prev,
                    walkers: prev.walkers.includes(walkerName)
                        ? prev.walkers.filter(w => w !== walkerName)
                        : [...prev.walkers, walkerName]
                }));
            };

            const handlePhotoUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                setUploading(true);
                try {
                    const uploadPromises = files.map(async (file) => {
                        const compressedBlob = await compressImage(file);
                        const randomId = Math.random().toString(36).substring(7);
                        const fileName = file.name.split('.')[0] + '.jpg';
                        const ref = storage.ref(`walks/${Date.now()}_${randomId}_${fileName}`);
                        await ref.put(compressedBlob);
                        return await ref.getDownloadURL();
                    });
                    const newUrls = await Promise.all(uploadPromises);
                    setFormData(prev => ({ ...prev, photos: [...prev.photos, ...newUrls] }));
                } catch (err) {
                    alert('アップロードに失敗しました: ' + err);
                } finally {
                    setUploading(false);
                    e.target.value = '';
                }
            };

            const removePhoto = (index) => {
                setFormData(prev => ({ ...prev, photos: prev.photos.filter((_, i) => i !== index) }));
            };

            const handleSubmit = () => {
                if (formData.walkers.length === 0) { alert('散歩者を選択してください'); return; }
                const start = new Date(formData.startTime);
                const end = new Date(formData.endTime);
                if (isNaN(start.getTime()) || isNaN(end.getTime())) { alert('日時が正しくありません'); return; }
                if (end < start) { alert('終了時間は開始時間より後にしてください'); return; }
                const newDuration = Math.floor((end - start) / 60000);
                const saveData = {
                    ...formData,
                    startTime: firebase.firestore.Timestamp.fromDate(start),
                    endTime: firebase.firestore.Timestamp.fromDate(end),
                    duration: newDuration
                };
                onSave(saveData);
            };

            return React.createElement('div', {
                className: 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4'
            },
                React.createElement('div', { className: 'bg-white rounded-lg w-full max-w-md max-h-[85vh] overflow-y-auto' },
                    React.createElement('div', { className: 'p-4' },
                        React.createElement('h3', { className: 'font-bold text-lg mb-4' }, '散歩記録を編集'),
                        React.createElement('div', { className: 'space-y-4' },
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium mb-2' }, '日時'),
                                React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'text-xs text-gray-500' }, '開始'),
                                        React.createElement('input', {
                                            type: 'datetime-local',
                                            value: formData.startTime,
                                            onChange: (e) => setFormData({ ...formData, startTime: e.target.value }),
                                            className: 'w-full p-2 border rounded text-sm'
                                        })
                                    ),
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'text-xs text-gray-500' }, '終了'),
                                        React.createElement('input', {
                                            type: 'datetime-local',
                                            value: formData.endTime,
                                            onChange: (e) => setFormData({ ...formData, endTime: e.target.value }),
                                            className: 'w-full p-2 border rounded text-sm'
                                        })
                                    )
                                )
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium mb-2' }, '散歩者'),
                                React.createElement('div', { className: 'space-y-2' },
                                    walkers.map(w => React.createElement('label', {
                                        key: w.id, className: 'flex items-center p-2 border rounded cursor-pointer hover:bg-gray-50'
                                    },
                                        React.createElement('input', {
                                            type: 'checkbox', checked: formData.walkers.includes(w.name),
                                            onChange: () => toggleWalker(w.name), className: 'mr-2 w-5 h-5'
                                        }),
                                        React.createElement('span', null, w.name)
                                    ))
                                )
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium mb-2' }, '元気度: ' + getEnergyLabel(formData.energy)),
                                React.createElement('input', {
                                    type: 'range', min: '1', max: '5',
                                    value: formData.energy,
                                    onChange: (e) => setFormData({ ...formData, energy: parseInt(e.target.value) }),
                                    className: 'w-full'
                                }),
                                React.createElement('div', { className: 'flex justify-between text-xs text-gray-500' },
                                    React.createElement('span', null, '絶不調'),
                                    React.createElement('span', null, '普通'),
                                    React.createElement('span', null, '絶好調')
                                )
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium mb-2' }, '記録'),
                                React.createElement('div', { className: 'grid grid-cols-3 gap-2' },
                                    React.createElement('button', {
                                        onClick: () => setFormData({ ...formData, pee: !formData.pee }),
                                        type: 'button',
                                        className: `py-3 rounded-lg border-2 ${formData.pee ? 'bg-yellow-100 border-yellow-500' : 'border-gray-300'}`
                                    }, '💧 おしっこ'),
                                    React.createElement('button', {
                                        onClick: () => setFormData({ ...formData, poo: !formData.poo }),
                                        type: 'button',
                                        className: `py-3 rounded-lg border-2 ${formData.poo ? 'bg-amber-100 border-amber-500' : 'border-gray-300'}`
                                    }, '💩 うんち'),
                                    React.createElement('button', {
                                        onClick: () => setFormData({ ...formData, water: !formData.water }),
                                        type: 'button',
                                        className: `py-3 rounded-lg border-2 ${formData.water ? 'bg-blue-100 border-blue-500' : 'border-gray-300'}`
                                    }, '💧 水')
                                )
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium mb-2' }, '写真'),
                                React.createElement('div', { className: 'grid grid-cols-4 gap-2 mb-2' },
                                    formData.photos.map((url, i) => React.createElement('div', { key: i, className: 'relative' },
                                        React.createElement('img', { src: url, className: 'w-full h-16 object-cover rounded' }),
                                        React.createElement('button', {
                                            onClick: () => removePhoto(i),
                                            className: 'absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 text-xs'
                                        }, '×')
                                    ))
                                ),
                                React.createElement('input', {
                                    type: 'file', accept: 'image/*', multiple: true, onChange: handlePhotoUpload,
                                    disabled: uploading, className: 'w-full text-sm'
                                }),
                                uploading && React.createElement('p', { className: 'text-sm text-gray-500' }, 'アップロード中...')
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium mb-2' }, 'メモ'),
                                React.createElement('textarea', {
                                    value: formData.memo, onChange: (e) => setFormData({ ...formData, memo: e.target.value }),
                                    className: 'w-full p-2 border rounded-lg', rows: 3
                                })
                            ),
                            React.createElement('div', { className: 'flex gap-2' },
                                React.createElement('button', { onClick: handleSubmit, className: 'flex-1 bg-blue-500 text-white py-2 rounded-lg' }, '保存'),
                                React.createElement('button', { onClick: onCancel, className: 'flex-1 bg-gray-300 py-2 rounded-lg' }, 'キャンセル')
                            )
                        )
                    )
                )
            );
        }

        function HealthForm({ type, walkers, formData, onChange, onSave, onCancel }) {
            const [uploading, setUploading] = useState(false);

            const handleSubmit = () => {
                if (!formData.walker) { alert('担当者を選択してください'); return; }
                if (type === 'hospital' && !formData.hospitalName) { alert('病院名を入力してください'); return; }
                if (type === 'grooming' && formData.groomedBy === 'shop' && !formData.shopName) { alert('店舗名を入力してください'); return; }
                if (type === 'medicine' && !formData.medicineType) { alert('薬の種類を入力してください'); return; }
                if (type === 'weight' && !formData.weight) { alert('体重を入力してください'); return; }
                onSave(formData);
            };

            const handlePhotoUpload = async (e) => {

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [isWalking, setIsWalking] = useState(false);
            const [currentWalk, setCurrentWalk] = useState(null);
            const [walks, setWalks] = useState([]);
            const [healthRecords, setHealthRecords] = useState([]);
            const [walkers, setWalkers] = useState([]);
            const [selectedWalkers, setSelectedWalkers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newWalkerName, setNewWalkerName] = useState('');
            const [showAddWalker, setShowAddWalker] = useState(false);
            const [uploadingPhotos, setUploadingPhotos] = useState(false);
            const [photos, setPhotos] = useState([]);
            const [statsView, setStatsView] = useState('week');
            const [showHealthForm, setShowHealthForm] = useState(false);
            const [healthType, setHealthType] = useState('hospital');
            const [editingWalk, setEditingWalk] = useState(null);
            const [editingHealth, setEditingHealth] = useState(null);
            const [showMap, setShowMap] = useState(null);
            const [viewingPhoto, setViewingPhoto] = useState(null);
            const [now, setNow] = useState(new Date());

            // ★Ref for GPS tracking
            const lastMoveTimeRef = useRef(Date.now());
            const lastPositionRef = useRef(null);
            const watchIdRef = useRef(null);
            const wakeLockRef = useRef(null);
            const endWalkRef = useRef(() => {});

            const [showWalkSetup, setShowWalkSetup] = useState(false);

            // ★独立した通知設定 (初期値: OFF)
            const [notifyStart, setNotifyStart] = useState(false);
            const [notifyEnd, setNotifyEnd] = useState(false);

            const [healthFormData, setHealthFormData] = useState({});
            const [originalHealthData, setOriginalHealthData] = useState({});

            const [homePage, setHomePage] = useState(1);
            const [healthPage, setHealthPage] = useState(1);
            const ITEMS_PER_PAGE = 20;

            const formatRelativeTime = (date) => {
                if (!date) return '';
                const d = new Date(date);
                const now = new Date();
                const diffMs = now - d;
                const diffHours = diffMs / (1000 * 60 * 60);

                if (diffHours < 24 && diffHours >= 0) {
                    if (diffHours < 1) {
                        const diffMins = Math.floor(diffMs / (1000 * 60));
                        return diffMins <= 0 ? 'たった今' : `${diffMins}分前`;
                    }
                    return `${Math.floor(diffHours)}時間前`;
                }
                const year = d.getFullYear().toString().slice(-2);
                return `${year}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
            };

            const formatSimpleTimeAgo = (date) => {
                if (!date) return '';
                const now = new Date();
                const d = new Date(date);
                const diffMs = now - d;
                const diffMins = Math.floor(diffMs / (1000 * 60));
                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                const diffMonths = Math.floor(diffDays / 30);

                if (diffMins < 60) return `${diffMins}分前`;
                if (diffHours < 24) return `${diffHours}時間前`;
                if (diffDays < 30) return `${diffDays}日前`;
                if (diffMonths < 12) return `${diffMonths}ヶ月前`;
                return '1年以上前';
            };

            const formatDate = (date) => {
                if (!date) return '';
                const d = new Date(date);
                const year = d.getFullYear().toString().slice(-2);
                return `${year}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
            };

            useEffect(() => {
                let timer;
                if (isWalking) {
                    timer = setInterval(() => setNow(new Date()), 1000);
                }
                return () => clearInterval(timer);
            }, [isWalking]);

            useEffect(() => {
                const unsubscribe = db.collection('walkers').onSnapshot((snapshot) => {
                    const walkerList = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                    setWalkers(walkerList.sort((a, b) => a.order - b.order));
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const unsubscribe = db.collection('walks').orderBy('startTime', 'desc').onSnapshot((snapshot) => {
                    const walkList = snapshot.docs.map(doc => ({
                        ...doc.data(), id: doc.id,
                        startTime: doc.data().startTime?.toDate(),
                        endTime: doc.data().endTime?.toDate()
                    }));
                    setWalks(walkList);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const unsubscribe = db.collection('health').orderBy('date', 'desc').onSnapshot((snapshot) => {
                    const records = snapshot.docs.map(doc => ({
                        ...doc.data(), id: doc.id,
                        date: doc.data().date?.toDate()
                    }));
                    setHealthRecords(records);
                });
                return () => unsubscribe();
            }, []);

            const initHealthForm = (type, record) => {
                const initialData = {
                    id: record?.id || null,
                    type: record?.type || type,
                    date: record ? new Date(record.date).toISOString().split('T')[0] : getTodayDateString(),
                    time: record ? new Date(record.date).toTimeString().slice(0, 5) : new Date().toTimeString().slice(0, 5),
                    walker: record?.walker || '',
                    hospitalName: record?.hospitalName || '',
                    reason: record?.reason || '',
                    groomedBy: record?.groomedBy || 'walker',
                    shopName: record?.shopName || '',
                    medicineType: record?.medicineType || '',
                    isVaccine: record?.isVaccine || false,
                    pooFirmness: record?.pooFirmness || 3,
                    foodAmount: record?.foodAmount || 3,
                    isFloorCleaned: record?.isFloorCleaned || false,
                    isToiletCleaned: record?.isToiletCleaned || false,
                    isWaterChanged: record?.isWaterChanged || false,
                    weight: record?.weight || '',
                    memo: record?.memo || '',
                    photos: record?.photos || [],
                    notify: false
                };
                setHealthFormData(initialData);
                setOriginalHealthData(initialData);
                setHealthType(type);
                if (record) setEditingHealth(record);
                setShowHealthForm(true);
                setShowWalkSetup(false);
            };

            const handleTabChange = (newTab) => {
                if (isWalking && newTab !== 'health') { alert('散歩中です！'); return; }
                if (activeTab === 'health' && showHealthForm) {
                    const isDirty = JSON.stringify(healthFormData) !== JSON.stringify(originalHealthData);
                    if (isDirty) {
                        if (confirm('変更内容を保存しますか？\nOK: 保存して移動\nキャンセル: 変更を破棄して移動')) {
                            saveHealthRecord(healthFormData);
                        } else { setShowHealthForm(false); setEditingHealth(null); }
                    } else { setShowHealthForm(false); setEditingHealth(null); }
                }
                setActiveTab(newTab);
            };

            const toggleWalker = (walkerName) => {
                setSelectedWalkers(prev => {
                    if (prev.includes(walkerName)) { return prev.filter(w => w !== walkerName); }
                    else {
                        if (prev.length >= 10) { alert('散歩者は最大10人までです'); return prev; }
                        return [...prev, walkerName];
                    }
                });
            };

            const addWalker = async () => {
                if (!newWalkerName.trim()) return;
                await db.collection('walkers').add({ name: newWalkerName.trim(), order: walkers.length });
                setNewWalkerName(''); setShowAddWalker(false);
            };

            const deleteWalker = async (walkerId) => {
                if (confirm('この散歩者を削除しますか?')) { await db.collection('walkers').doc(walkerId).delete(); }
            };

            const handlePhotoUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                if (photos.length + files.length > 4) { alert('写真は最大4枚までです'); e.target.value = ''; return; }
                setUploadingPhotos(true);
                try {
                    const uploadPromises = files.map(async (file) => {
                        const compressedBlob = await compressImage(file);
                        const randomId = Math.random().toString(36).substring(7);
                        const fileName = file.name.split('.')[0] + '.jpg';
                        const ref = storage.ref(`walks/${Date.now()}_${randomId}_${fileName}`);
                        await ref.put(compressedBlob);
                        return await ref.getDownloadURL();
                    });
                    const uploadedUrls = await Promise.all(uploadPromises);
                    setPhotos(prev => [...prev, ...uploadedUrls]);
                } catch (error) { console.error(error); alert('アップロード中にエラーが発生しました: ' + error.message); }
                finally { setUploadingPhotos(false); e.target.value = ''; }
            };

            const removePhoto = (index) => { setPhotos(photos.filter((_, i) => i !== index)); };

            const calculateDistance = (lat1, lng1, lat2, lng2) => {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            };

            const calculateTotalDistance = (positions) => {
                if (positions.length < 2) return 0;
                let total = 0;
                for (let i = 1; i < positions.length; i++) {
                    total += calculateDistance(positions[i - 1].lat, positions[i - 1].lng, positions[i].lat, positions[i].lng);
                }
                return total;
            };

            const startWalk = () => {
                if (selectedWalkers.length === 0) { alert('散歩者を選択してください'); return; }
                if (!navigator.geolocation) { alert('お使いのブラウザは位置情報に対応していません'); return; }

                // ★WakeLock (画面常時オン)
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen')
                        .then(lock => { wakeLockRef.current = lock; console.log('Wake Lock acquired'); })
                        .catch(err => console.error('Wake Lock error:', err));
                }

                const walk = {
                    walkers: selectedWalkers, startTime: new Date(), positions: [],
                    pee: false, poo: false, pooFirmness: 3, energy: 3, water: false, memo: '', photos: [], weather: null
                };

                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const initialPos = {
                            lat: position.coords.latitude, lng: position.coords.longitude,
                            time: new Date(), accuracy: position.coords.accuracy
                        };
                        walk.positions.push(initialPos);
                        lastPositionRef.current = initialPos;
                        lastMoveTimeRef.current = Date.now();

                        setCurrentWalk(walk);
                        setIsWalking(true);
                        setShowWalkSetup(false);
                        setPhotos([]);
                        setNow(new Date());

                        // ★LINE通知（チェックされている場合のみ）
                        if (notifyStart) {
                            const notifyWalkStart = functions.httpsCallable('notifyWalkStart');
                            notifyWalkStart({ walkers: selectedWalkers })
                                .then(() => console.log('LINE通知送信成功'))
                                .catch(err => {
                                    console.error('LINE通知送信失敗', err);
                                    alert('LINE通知送信失敗: ' + err.message);
                                });
                        } else {
                            console.log('LINE通知はスキップされました');
                        }

                        const weatherData = await fetchWeatherData(position.coords.latitude, position.coords.longitude);
                        if (weatherData) {
                            setCurrentWalk(prev => { if (!prev) return null; return { ...prev, weather: weatherData }; });
                        }
                    },
                    (error) => { alert('位置情報の取得に失敗しました。位置情報を許可してください。: ' + error.message); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            // ★endWalkRefを同期 (Stale Closure対策)
            useEffect(() => {
                endWalkRef.current = endWalk;
            }, [endWalk]);

            // ★GPS追跡 & 自動停止チェック (watchPositionに変更)
            useEffect(() => {
                if (!isWalking) return;

                // 1. watchPosition 開始
                const id = navigator.geolocation.watchPosition(
                    (position) => {
                        if (position.coords.accuracy > 50) return; // 精度が悪い場合は無視

                        const newPos = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            time: new Date(),
                            accuracy: position.coords.accuracy
                        };

                        setCurrentWalk(prev => {
                            if (!prev) return null;
                            // 移動距離判定 (前回の「有効な移動」位置から)
                            if (lastPositionRef.current) {
                                const dist = calculateDistance(lastPositionRef.current.lat, lastPositionRef.current.lng, newPos.lat, newPos.lng);
                                if (dist > 5) { // 5m以上移動したら「動いている」とみなす
                                    lastMoveTimeRef.current = Date.now();
                                    lastPositionRef.current = newPos;
                                }
                            } else {
                                lastPositionRef.current = newPos;
                                lastMoveTimeRef.current = Date.now();
                            }
                            return { ...prev, positions: [...prev.positions, newPos] };
                        });
                    },
                    (err) => console.error('GPS Watch Error:', err),
                    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
                );
