<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福といっしょ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3B82F6">
    <!-- v2.16.0: cdn.tailwindcss.com（ブラウザ上でJITコンパイルする Play CDN）から
         ビルド済みCSSへ移行。実行時のコンパイラJS約300KBのDL・パース・実行と
         MutationObserverによる常時DOM監視が不要になり、旧機種の初期表示が高速化する。
         クラスを追加したら再生成すること（tests/verify-tailwind-css.js 参照） -->
    <link rel="stylesheet" href="dist/tailwind.css">
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDmVWeNkaqts5QAqjlSqnlUNhR1HT7Vp38"></script>
    <style>
        /* スクロールバーを隠すためのCSS */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* モーダルスクロール制御 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            overscroll-behavior: contain;
        }

        .modal-content {
            max-height: 90vh;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:1.125rem;color:#374151;">
            読み込み中...</div>
    </div>
    <script type="module" src="src/app.js"></script>
    <script>
        // Service Worker登録（v2.14.0で初めて有効化。CDNライブラリを端末にキャッシュし2回目以降の起動を高速化）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .catch((err) => console.warn('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
